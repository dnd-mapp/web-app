name: Pull request closed

# No branches filter, for the same reason as in pull-request.yml: a pull request in a stack targets the branch of the
# pull request below it.
on:
    pull_request:
        types:
            - closed

permissions: {}

jobs:
    # Removes dndmapp/web-app:pr-<N> from Docker Hub for every closed pull request from a branch of this repository, the
    # ones pull-request.yml builds for. Whether a pull request got an image is not decided again here. A pull request
    # in a stack gets one whatever its files, a stack can be taken apart again, and the filter's own answer moves with
    # the base GitHub retargets. The rule that published the tag may therefore no longer hold when the pull request
    # closes. Asking Docker Hub is cheaper than reconstructing that history, and a 404 below means there is nothing to
    # remove. The concurrency
    # group is the one the Build image job in pull-request.yml uses, so closing a pull request mid-build cancels the
    # build before the tag is removed, and a build that starts on reopening waits for the removal to finish.
    delete-image:
        name: Delete image
        if: github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-24.04
        timeout-minutes: 2
        permissions: {}
        concurrency:
            group: pull-request-build-image-${{ github.event.pull_request.number }}
            cancel-in-progress: true
        steps:
            # Docker Hub's documented API only reads tags; the endpoint below is the one docker/hub-tool deletes them
            # with. The token is not the one the build uses: Docker Hub has no delete-only scope and no per-repository
            # scope for a personal access token, so a token that can delete a tag can delete every tag in the account.
            # It belongs in this job, which runs no project code, and not in the build, which runs the Dockerfile and
            # every dependency. The credentials go through the environment and stdin, so they never show up in a
            # command line. A 404 means the build never pushed the tag, or an earlier run already removed it, so
            # there is nothing left to do.
            - name: Delete the tag from Docker Hub
              shell: bash
              env:
                  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
                  DOCKERHUB_ADMIN_TOKEN: ${{ secrets.DOCKERHUB_ADMIN_TOKEN }}
                  TAG: pr-${{ github.event.pull_request.number }}
              run: |
                  access_token="$(
                      jq --null-input --arg identifier "$DOCKERHUB_USERNAME" --arg secret "$DOCKERHUB_ADMIN_TOKEN" \
                          '{ identifier: $identifier, secret: $secret }' |
                          curl --fail --silent --show-error --request POST --header 'Content-Type: application/json' \
                              --data @- https://hub.docker.com/v2/auth/token |
                          jq --raw-output --exit-status .access_token
                  )"
                  echo "::add-mask::$access_token"

                  status="$(
                      curl --silent --show-error --output /dev/null --write-out '%{http_code}' --request DELETE \
                          --header "Authorization: Bearer $access_token" \
                          "https://hub.docker.com/v2/repositories/dndmapp/web-app/tags/$TAG/"
                  )"

                  case "$status" in
                      2??) echo "Deleted dndmapp/web-app:$TAG." ;;
                      404) echo "dndmapp/web-app:$TAG does not exist, so there is nothing to delete." ;;
                      *)
                          echo "::error::Deleting dndmapp/web-app:$TAG failed with HTTP $status."
                          exit 1
                          ;;
                  esac
