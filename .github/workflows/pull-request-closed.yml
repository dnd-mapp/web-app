name: Pull request closed

on:
    pull_request:
        types:
            - closed
        branches:
            - main

permissions: {}

jobs:
    # Decides whether the pull request got a preview image, by running the same filter that decided its build. The
    # filter reads the changed files through the GitHub API; the checkout is only there because a local action has to
    # be on disk before it resolves.
    image-changes:
        name: Detect image changes
        runs-on: ubuntu-24.04
        timeout-minutes: 2
        permissions:
            contents: read
            pull-requests: read
        concurrency:
            group: pull-request-closed-image-changes-${{ github.event.pull_request.number }}
            cancel-in-progress: true
        outputs:
            image: ${{ steps.filter.outputs.image }}
        steps:
            # A pull_request run checks out the merge commit by default, and GitHub has none for a closed pull request
            # that conflicts with its base. The head commit stays reachable through refs/pull/<N>/head, and it holds
            # the version of the filter that decided the build.
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  persist-credentials: false

            - name: Detect changes
              id: filter
              uses: ./.github/actions/detect-changes

    # Removes dndmapp/web-app:pr-<N> from Docker Hub under the same conditions that published it. The concurrency
    # group is the one the Build image job in pull-request.yml uses, so closing a pull request mid-build cancels the
    # build before the tag is removed, and a build that starts on reopening waits for the removal to finish.
    delete-image:
        name: Delete image
        needs: image-changes
        if: needs.image-changes.outputs.image == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-24.04
        timeout-minutes: 2
        permissions: {}
        concurrency:
            group: pull-request-build-image-${{ github.event.pull_request.number }}
            cancel-in-progress: true
        steps:
            # Docker Hub's documented API only reads tags; the endpoint below is the one docker/hub-tool deletes them
            # with. The credentials go through the environment and stdin, so they never show up in a command line. A
            # 404 means the build never pushed the tag, or an earlier run already removed it, so there is nothing left
            # to do.
            - name: Delete the tag from Docker Hub
              shell: bash
              env:
                  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
                  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
                  TAG: pr-${{ github.event.pull_request.number }}
              run: |
                  access_token="$(
                      jq --null-input --arg identifier "$DOCKERHUB_USERNAME" --arg secret "$DOCKERHUB_TOKEN" \
                          '{ identifier: $identifier, secret: $secret }' |
                          curl --fail --silent --show-error --request POST --header 'Content-Type: application/json' \
                              --data @- https://hub.docker.com/v2/auth/token |
                          jq --raw-output --exit-status .access_token
                  )"
                  echo "::add-mask::$access_token"

                  status="$(
                      curl --silent --show-error --output /dev/null --write-out '%{http_code}' --request DELETE \
                          --header "Authorization: Bearer $access_token" \
                          "https://hub.docker.com/v2/repositories/dndmapp/web-app/tags/$TAG/"
                  )"

                  case "$status" in
                      2??) echo "Deleted dndmapp/web-app:$TAG." ;;
                      404) echo "dndmapp/web-app:$TAG does not exist, so there is nothing to delete." ;;
                      *)
                          echo "::error::Deleting dndmapp/web-app:$TAG failed with HTTP $status."
                          exit 1
                          ;;
                  esac
