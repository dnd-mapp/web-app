name: Pull request

on:
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: read

jobs:
    ci:
        name: CI
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - name: Checkout repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Run CI checks
              uses: ./.github/actions/ci

            - name: Validate PR commits
              shell: bash
              env:
                  BASE: ${{ github.event.pull_request.base.sha }}
                  HEAD: ${{ github.event.pull_request.head.sha }}
              run: pnpm exec commitlint --from "$BASE" --to "$HEAD" --verbose

    changes:
        name: Detect image changes
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        outputs:
            image: ${{ steps.detect.outputs.image }}
        steps:
            - name: Checkout repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Detect image changes
              id: detect
              uses: ./.github/actions/detect-image-changes

    image:
        name: Build and push Docker Image
        needs:
            - ci
            - changes
        if: needs.changes.outputs.image == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - name: Checkout repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Build and push the pull-request image
              uses: ./.github/actions/build-image
              with:
                  pr-number: ${{ github.event.pull_request.number }}
                  username: ${{ secrets.DH_USERNAME }}
                  token: ${{ secrets.DH_READ_WRITE }}
