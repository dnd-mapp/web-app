name: Pull request

on:
    pull_request:

# Deny everything at the workflow level; each job opts back in to exactly what it needs.
permissions: {}

# Supersede in-flight runs for the same pull request; only the newest push matters.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    ci:
        name: CI
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            contents: read
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Run CI
              uses: ./.github/actions/ci

    commit-messages:
        name: Commit messages
        runs-on: ubuntu-24.04
        timeout-minutes: 2
        permissions:
            contents: read
        steps:
            # commitlint walks the range base..head, so the full history is required; the default shallow fetch would
            # leave those commits unavailable.
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Set up toolchain and install dependencies
              uses: ./.github/actions/setup

            # The SHAs are passed through the environment rather than interpolated into the script, so nothing from
            # the event payload is ever parsed as shell.
            - name: Lint commit messages
              shell: bash
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
