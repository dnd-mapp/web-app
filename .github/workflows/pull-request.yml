name: Pull request

on:
    pull_request:
        branches:
            - main

permissions: {}

jobs:
    ci:
        name: CI
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            contents: read
        concurrency:
            group: pull-request-ci-${{ github.event.pull_request.number }}
            cancel-in-progress: true
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # commitlint reads the commits between the two ends of the range below, which the default shallow
                  # fetch leaves out.
                  fetch-depth: 0
                  persist-credentials: false

            - name: Set up the workspace
              uses: ./.github/actions/setup-workspace

            # The range is base..head, so it holds the commits the pull request adds and nothing else, even once the
            # base branch has moved on. The two ends go through the environment rather than into the script, so a
            # branch name can never be read as shell.
            - name: Lint commit messages
              shell: bash
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

            - name: Run CI checks
              uses: ./.github/actions/run-checks

    # Decides whether the pull request touches anything the image is built from, so the build below only runs when it
    # would produce a different image. On a pull_request event the action lists the changed files through the API, so
    # it needs no checkout.
    image-changes:
        name: Detect image changes
        runs-on: ubuntu-24.04
        timeout-minutes: 2
        permissions:
            pull-requests: read
        concurrency:
            group: pull-request-image-changes-${{ github.event.pull_request.number }}
            cancel-in-progress: true
        outputs:
            image: ${{ steps.filter.outputs.image }}
        steps:
            # The patterns mirror .dockerignore: the files the build stage copies in, minus the test files it excludes,
            # plus the files that decide how the image is built. A change to either list belongs in the other as well.
            - name: Compare the changed files with the image inputs
              id: filter
              uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
              with:
                  predicate-quantifier: some-with-excludes
                  filters: |
                      image:
                          - .docker/**
                          - .dockerignore
                          - .github/workflows/pull-request.yml
                          - Dockerfile
                          - angular.json
                          - docker-bake.hcl
                          - package.json
                          - pnpm-lock.yaml
                          - pnpm-workspace.yaml
                          - projects/**
                          - tsconfig.json
                          - "!projects/**/testing/**"
                          - "!projects/**/*.spec.ts"
                          - "!projects/**/tsconfig.spec.json"
                          - "!projects/**/vitest.config.ts"

    # Builds the image for both platforms and pushes it to Docker Hub as dndmapp/web-app:pr-<N>. Only a branch of this
    # repository gets a build: a fork cannot read the registry credentials, and its Dockerfile is not ours to publish.
    # bake-action builds from the Git context of the pull request, so the job needs no checkout either.
    build-image:
        name: Build image
        needs: image-changes
        if: needs.image-changes.outputs.image == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: read
        concurrency:
            group: pull-request-build-image-${{ github.event.pull_request.number }}
            cancel-in-progress: true
        steps:
            # A multi-platform build with attestations needs the docker-container driver, which is the action's default.
            # No QEMU: the serve stage only copies files, so nothing runs under emulation.
            - name: Set up Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Log in to Docker Hub
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  username: ${{ vars.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            # The annotation levels make the action annotate the image index as well as each platform manifest, which
            # is where registries read the description of a multi-platform image from.
            - name: Derive image metadata
              id: metadata
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: dndmapp/web-app
                  tags: type=ref,event=pr
              env:
                  DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest

            # The metadata action writes its bake file into the runner's temporary directory, and bake-action reads
            # files from the Git context by default, hence the cwd:// prefix. The bake file leaves the platforms to the
            # PLATFORMS variable and the tags and labels to the metadata target; provenance and SBOM settings are in
            # the file, and bake-action leaves them alone because the target declares them.
            - name: Build and push the image
              uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
              with:
                  source: .
                  files: |
                      ./docker-bake.hcl
                      cwd://${{ steps.metadata.outputs.bake-file }}
                  push: true
              env:
                  PLATFORMS: linux/amd64,linux/arm64
