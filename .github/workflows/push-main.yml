name: Push main

on:
    push:
        branches:
            - main

permissions: {}

jobs:
    # Runs the same checks the pull request ran, this time against the merge commit on main. There is no merge queue, so
    # main may have moved on between the pull request's last CI run and its merge, and the merged result is what the
    # dev image is built from. Commit messages are not linted again: a push event carries no commit range, and the pull
    # request already checked them.
    ci:
        name: CI
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            contents: read
        concurrency:
            group: push-main-ci
            cancel-in-progress: false
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up the workspace
              uses: ./.github/actions/setup-workspace

            - name: Run CI checks
              uses: ./.github/actions/run-checks

    # Decides whether the push touches anything the image is built from, so the build below only runs when it would
    # produce a different image. The filter is the one that decides a pull request's preview image, so main only gets a
    # new image for a merge whose pull request got a preview. The same action reports whether the push changes the
    # texts on the image's Docker Hub page, which decides the upload at the bottom. On a push event the filter compares
    # the pushed commit with the one before the push through git, fetching what it needs itself, so a default checkout
    # is enough.
    changes:
        name: Detect changes
        runs-on: ubuntu-26.04
        timeout-minutes: 2
        permissions:
            contents: read
        concurrency:
            group: push-main-changes
            cancel-in-progress: false
        outputs:
            image: ${{ steps.filter.outputs.image }}
            hub: ${{ steps.filter.outputs.hub }}
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Detect changes
              id: filter
              uses: ./.github/actions/detect-changes

    # Builds the image for both platforms and pushes it to Docker Hub as dndmapp/web-app:dev and
    # dndmapp/web-app:sha-<short>. Builds do not cancel each other and run one at a time in push order, so dev always
    # ends up on the newest commit that changed the image, and every such commit gets its sha tag. The job also needs
    # CI, so a commit that fails its checks never becomes the dev image; the condition below only reads the filter
    # output, so a failed or cancelled CI job still skips the build. No fork check: only this repository pushes to its
    # main branch.
    build-image:
        name: Build image
        needs:
            - ci
            - changes
        if: needs.changes.outputs.image == 'true'
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        permissions:
            contents: read
        concurrency:
            group: push-main-build-image
            cancel-in-progress: false
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # type=sha yields sha- followed by the first seven characters of the commit. Neither rule adds latest, which
            # docker/metadata-action reserves for release tags.
            - name: Build and push the image
              uses: ./.github/actions/build-image
              with:
                  tags: |
                      type=raw,value=dev
                      type=sha
                  username: ${{ vars.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Has the watchtower container beside the dev environment, https://dev.dndmapp.nl.eu.org, pull dndmapp/web-app:dev
    # and recreate the container serving it, so the environment follows main. The job needs the build alone: the
    # environment exists to show the newest main, and the end-to-end tests run against the same image on the runner in
    # the meantime. A failing test therefore shows up beside a dev environment that already serves the commit. A skipped
    # build skips the deployment with it, since dev then still points at the image the environment already runs.
    # Deployments run one at a time in push order without canceling, like the builds they follow. The timeout outlasts
    # the ten minutes watchtower gives an update, so a slow update fails with watchtower's answer in the log.
    deploy-dev:
        name: Deploy to dev
        needs: build-image
        runs-on: ubuntu-26.04
        timeout-minutes: 15
        permissions:
            contents: read
        concurrency:
            group: push-main-deploy-dev
            cancel-in-progress: false
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Update the dev environment
              uses: ./.github/actions/deploy
              with:
                  tag: dev
                  watchtower-url: ${{ vars.WATCHTOWER_URL }}
                  watchtower-token: ${{ secrets.WATCHTOWER_TOKEN }}
                  tailscale-oauth-client-id: ${{ vars.TAILSCALE_OAUTH_CLIENT_ID }}
                  tailscale-oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}

    # Runs the Playwright tests against the merge's image, dndmapp/web-app:sha-<short>, served behind Caddy through the
    # compose stack under .docker. A merge that leaves the image inputs alone gets no image, and its app is the one dev
    # already serves, so the tests run against dndmapp/web-app:dev instead. The job needs the image, not CI, so a merge
    # that only fails a lint still reports its end-to-end result; !cancelled() gets the condition evaluated even though
    # Build image was skipped, while a failed build or a failed filter still skips the tests.
    e2e:
        name: End-to-end tests
        needs:
            - changes
            - build-image
        if: ${{ !cancelled() && (needs.build-image.result == 'success' || needs.changes.outputs.image == 'false') }}
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        permissions:
            contents: read
        concurrency:
            group: push-main-e2e
            cancel-in-progress: false
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up the workspace
              uses: ./.github/actions/setup-workspace

            # type=sha in Build image tags the image with sha- and the first seven characters of the commit, so the same
            # seven are cut here. The expression syntax has no substring, which is why this is a step.
            - name: Pick the image tag
              id: image
              shell: bash
              env:
                  BUILT: ${{ needs.build-image.result == 'success' }}
                  SHA: ${{ github.sha }}
              run: |
                  if [ "$BUILT" = true ]; then
                      echo "tag=sha-${SHA:0:7}" >> "$GITHUB_OUTPUT"
                  else
                      echo "tag=dev" >> "$GITHUB_OUTPUT"
                  fi

            - name: Run the end-to-end tests
              uses: ./.github/actions/run-e2e
              with:
                  tag: ${{ steps.image.outputs.tag }}
                  username: ${{ vars.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_READ_TOKEN }}

    # Uploads the texts under .docker/hub to the page of dndmapp/web-app on Docker Hub: short-description.txt as the
    # one-line description and overview.md as the repository overview. The job needs the filter alone, not CI or the
    # build: the texts describe the image rather than being part of it, and the job runs no project code. Uploads run
    # one at a time in push order without cancelling, so the page always shows the texts of the newest commit that
    # changed them.
    hub-description:
        name: Update Docker Hub description
        needs: changes
        if: needs.changes.outputs.hub == 'true'
        runs-on: ubuntu-26.04
        timeout-minutes: 2
        permissions:
            contents: read
        concurrency:
            group: push-main-hub-description
            cancel-in-progress: false
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # The action takes the short description as an input rather than a file, and it trims one longer than the
            # 100 characters Docker Hub allows with no more than a warning. This step reads the file into an output and
            # fails instead, pointing at the file. $(cat) drops the trailing newline, which would otherwise count
            # towards the limit and show up on the page.
            - name: Read the short description
              id: short-description
              shell: bash
              run: |
                  file=.docker/hub/short-description.txt
                  description="$(cat "$file")"

                  if [ "${#description}" -gt 100 ]; then
                      message="The short description has ${#description} characters, and Docker Hub allows 100."
                      echo "::error file=$file::$message"
                      exit 1
                  fi
                  echo "description=$description" >> "$GITHUB_OUTPUT"

            # The token is the one Delete image in pull-request-closed.yml uses: editing a repository's settings takes
            # a personal access token with the Read, Write & Delete scope, which Docker Hub cannot narrow to one
            # repository. It belongs in a job like this one, which runs no project code, and not in the build, which
            # runs the Dockerfile and every dependency. URL completion stays off: the links in the overview are already
            # absolute, and the action would rewrite the ones inside code as well.
            - name: Upload the description and overview to Docker Hub
              uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
              with:
                  username: ${{ vars.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_ADMIN_TOKEN }}
                  repository: dndmapp/web-app
                  short-description: ${{ steps.short-description.outputs.description }}
                  readme-filepath: .docker/hub/overview.md
