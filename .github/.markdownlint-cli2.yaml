# yaml-language-server: $schema=https://raw.githubusercontent.com/DavidAnson/markdownlint-cli2/main/schema/markdownlint-cli2-config-schema.json

# Merges into the root config for the Markdown under .github. The pull request template starts at a second-level
# heading, since GitHub renders the pull request title above the body, so the first-line-heading rule is off here.
config:
    MD041: false
