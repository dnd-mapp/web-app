name: Run end-to-end tests
description: Serve a published dndmapp/web-app image behind Caddy through the compose stack under .docker and run the Playwright tests against it.

# The steps every end-to-end run shares; what differs between runs is which image tag is served. The calling workflow
# checks the repository out and runs setup-workspace first: a local action only resolves once a checkout has put it on
# disk, and the tests need pnpm and the dependencies. A composite action cannot read secrets or variables of its own,
# so the workflow hands the credentials in. No step stops the stack: the runner is discarded with the job, containers
# and all.
inputs:
    tag:
        description: The dndmapp/web-app tag to serve, such as pr-12 or sha-1a2b3c4.
        required: true
    username:
        description: The Docker Hub account that owns the image.
        required: true
    password:
        description: A read-only Docker Hub access token for that account.
        required: true

runs:
    using: composite
    steps:
        # Docker Hub rate limits anonymous pulls per IP address, and GitHub's runners share theirs, so the app image and
        # the Caddy image are both pulled as the account that owns the app image. The job pulls and never pushes, and it
        # runs the tests and every dependency, so the token it gets is one that can only read.
        - name: Log in to Docker Hub
          uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
          with:
              username: ${{ inputs.username }}
              password: ${{ inputs.password }}

        - name: Install Playwright browsers
          shell: bash
          run: pnpm run playwright-install

        # The tag goes through the environment, where compose substitutes it into the image name. --wait returns once
        # Caddy's health check passes, which requests the app through the whole chain, and fails as soon as the check
        # gives up; the timeout is the backstop for a stack that never reports either.
        - name: Start the stack
          shell: bash
          env:
              WEB_APP_TAG: ${{ inputs.tag }}
          run: docker compose --file .docker/compose.yaml up --wait --wait-timeout 90 --quiet-pull

        # GitHub sets CI on every run, so the Playwright config starts no dev server and runs against the stack.
        - name: Run the end-to-end tests
          shell: bash
          run: pnpm run e2e

        - name: Print the stack logs
          if: failure()
          shell: bash
          run: docker compose --file .docker/compose.yaml logs --no-color

        # The HTML report and the traces of the failed tests, which the Playwright config writes under .playwright.
        # Nothing is there when the stack itself failed to start, which the logs above cover.
        - name: Upload the report and traces
          if: failure()
          uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
          with:
              name: playwright-report
              path: .playwright/
              retention-days: 7
              if-no-files-found: ignore
