name: Build image
description: Build dndmapp/web-app for linux/amd64 and linux/arm64 and push it to Docker Hub under the given tags.

# The steps here are the ones every image build shares; what differs between builds is which tags the image gets. The
# checkout stays in the calling workflow, since a local action only resolves once a checkout has put it on disk. A
# composite action cannot read secrets or variables of its own, so the workflow hands the credentials in.
inputs:
    tags:
        description: The tag rules for docker/metadata-action, one per line, such as 'type=ref,event=pr'.
        required: true
    username:
        description: The Docker Hub account that owns the image.
        required: true
    password:
        description: A Docker Hub access token for that account with read and write access.
        required: true

runs:
    using: composite
    steps:
        # A multi-platform build with attestations needs the docker-container driver, which is the action's default.
        # No QEMU: the serve stage only copies files, so nothing runs under emulation.
        - name: Set up Buildx
          uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

        - name: Log in to Docker Hub
          uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
          with:
              username: ${{ inputs.username }}
              password: ${{ inputs.password }}

        # The annotation levels make the action annotate the image index as well as each platform manifest, which is
        # where registries read the description of a multi-platform image from.
        - name: Derive image metadata
          id: metadata
          uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
          with:
              images: dndmapp/web-app
              tags: ${{ inputs.tags }}
          env:
              DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest

        # Bake runs from the checkout, so it reads docker-bake.hcl from there and the metadata action's file from the
        # absolute path in the runner's temporary directory. The bake file leaves the platforms to the PLATFORMS
        # variable and the tags and labels to the metadata target; provenance and SBOM settings are in the file, and
        # bake-action leaves them alone because the target declares them.
        #
        # The layer cache lives in the GitHub Actions cache under the web-app scope. GitHub hands a run the cache
        # entries of its own branch and of main, so a pull request reuses what main and its own earlier runs exported,
        # and main reuses its own. mode=max exports every stage's layers, not only the final image's, so the build
        # stage with its installed dependencies is a hit until the Dockerfile or the lockfile changes. The pnpm store
        # behind the cache mount in the Dockerfile is not a layer and is not exported, so a lockfile change installs
        # from the registry again. Buildx reaches the cache service through ACTIONS_RUNTIME_TOKEN and
        # ACTIONS_RESULTS_URL, which the runner gives every JavaScript action and bake-action passes on. ignore-error
        # keeps a failed cache upload from failing a build whose image is already pushed.
        - name: Build and push the image
          uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
          with:
              source: .
              files: |
                  ./docker-bake.hcl
                  ${{ steps.metadata.outputs.bake-file }}
              push: true
          env:
              PLATFORMS: linux/amd64,linux/arm64
              CACHE_FROM: type=gha,scope=web-app
              CACHE_TO: type=gha,scope=web-app,mode=max,ignore-error=true
