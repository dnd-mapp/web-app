name: Build the container image
description: Build the multi-arch web-app image with docker buildx bake and push it under a pull-request tag.

inputs:
    repository:
        description: Docker Hub repository in "namespace/name" form.
        required: false
        default: dndmapp/web-app
    pr-number:
        description: Pull-request number, used for the pr-<N> tag.
        required: true
    username:
        description: Docker Hub username.
        required: true
    token:
        description: Docker Hub access token with write scope.
        required: true

runs:
    using: composite
    steps:
        - name: Docker Hub setup
          uses: ./.github/actions/dockerhub-setup
          with:
              username: ${{ inputs.username }}
              token: ${{ inputs.token }}

        - name: Collect image metadata
          id: meta
          uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
          with:
              images: ${{ inputs.repository }}

        - name: Validate the bake file and Dockerfile
          shell: bash
          run: |
              set -euo pipefail

              docker buildx bake --print default local
              docker build --check .

        - name: Build and push
          uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
          env:
              IMAGE: ${{ inputs.repository }}
              TAGS: pr-${{ inputs.pr-number }}
          with:
              files: |
                  ./docker-bake.hcl
                  cwd://${{ steps.meta.outputs.bake-file }}
                  cwd://${{ steps.meta.outputs.bake-file-annotations }}
              targets: default
              push: true
              set: |
                  *.cache-from=type=gha
                  *.cache-to=type=gha,mode=max
