name: Run CI checks
description: Run every CI check against the checked-out, set-up workspace.

runs:
    using: composite
    steps:
        - name: Check formatting
          shell: bash
          run: pnpm run format-check

        - name: Lint Markdown
          shell: bash
          run: pnpm run lint-md

        - name: Lint styles
          shell: bash
          run: pnpm run lint-styles

        - name: Lint TypeScript
          shell: bash
          run: pnpm run lint-ts

        - name: Lint JavaScript
          shell: bash
          run: pnpm run lint-js

        - name: Compile app
          shell: bash
          run: pnpm run build

        - name: Check Dockerfile
          shell: bash
          run: docker build --check .

        - name: Install Playwright browsers
          shell: bash
          run: pnpm run playwright-install

        - name: Run tests
          shell: bash
          run: pnpm run test-ci
