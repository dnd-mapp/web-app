# Rootless nginx daemon config for the web-app container image.
#
# Differences from the stock nginx.conf that make it run as a non-root user on a
# read-only root filesystem (see docs/adr/0001-hand-rolled-rootless-nginx-container.md):
#   - no top-level `user` directive (only meaningful when the master runs as root)
#   - pid file and every *_temp_path live under /tmp, the only writable path
#   - logs go straight to stdout/stderr
#
# The container therefore needs only a writable /tmp at runtime. Under a hardened
# runtime (`docker run --read-only`, Kubernetes `readOnlyRootFilesystem: true`)
# mount a tmpfs at /tmp.

worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Writable scratch space. /tmp is the only path guaranteed writable at
    # runtime, and nginx's mkdir() for these only creates the final component,
    # so they sit directly under /tmp rather than in a /tmp/nginx subdirectory.
    client_body_temp_path /tmp/client_body_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /dev/stdout combined;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    keepalive_timeout 65;

    # Serve *.gz produced by the build stage; fall back to on-the-fly gzip.
    gzip           on;
    gzip_static    on;
    gzip_vary      on;
    gzip_proxied   any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml;

    # Cache-Control is chosen by $uri so it can be set with a single server-level
    # add_header. Keeping every add_header at one inheritance level avoids nginx's
    # "a location-level add_header drops all inherited ones" footgun.
    #
    #   - content-hashed bundles (main-AB12CD34.js) -> immutable, one year
    #   - other static assets copied from public/    -> one day
    #   - index.html and SPA routes                  -> always revalidate
    map $uri $cache_control {
        default                                                              "no-cache";
        "~*-[a-z0-9]{8,}\.(?:js|css|mjs)$"                                    "public, max-age=31536000, immutable";
        "~*\.(?:woff2?|ttf|otf|eot|png|jpe?g|gif|svg|webp|avif|ico)$"         "public, max-age=86400";
    }

    include /etc/nginx/conf.d/*.conf;
}
