# Server block for the compiled application. It replaces the default.conf that ships with the nginx image, and
# nginx.conf from that image includes it into the http block.

server {
    listen 4200;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hand every route that does not match a file to the Angular router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always revalidate the entry point, so a deploy is picked up on the next load.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Scripts and styles carry a content hash in their name, so they can be cached for as long as the browser allows.
    location ~* \.(?:js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
}
