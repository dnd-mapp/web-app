# web-app server block: static Angular SPA, rootless nginx.
#
# TLS is always terminated upstream (reverse proxy / ingress). This server speaks
# plain HTTP on 4200, the same port the Angular dev server uses, so the upstream
# maps :443 -> :4200. 4200 is unprivileged, so no CAP_NET_BIND_SERVICE is needed.

server {
    listen 4200;
    listen [::]:4200;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health endpoint: no filesystem hit, not logged. Used by the Docker
    # HEALTHCHECK and reusable as a Kubernetes liveness/readiness probe path.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Single-page app: unknown paths are client-side routes, serve the shell.
    location / {
        try_files $uri /index.html;
    }

    # All add_header directives at server level (one inheritance level, see the
    # $cache_control note in nginx.conf). `always` so they cover error responses.
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
