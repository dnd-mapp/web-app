# yaml-language-server: $schema=https://www.schemastore.org/pnpm-workspace.json

# Dependency Resolution Settings
minimumReleaseAge: 4320 # 3 days
minimumReleaseAgeExclude:
  - "@dnd-mapp/*"
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 4320 # 3 days

# Peer Dependency Settings
autoInstallPeers: false
dedupePeers: true
peerDependencyRules:
  ignoreMissing: []
strictPeerDependencies: true

# CLI Settings
engineStrict: true

# Build Settings
allowBuilds: {}

# Other Settings
catalogMode: strict
savePrefix: "~"

# Catalogs
catalogs:
  angular:
    "@angular/cli": ~22.1.8
    "@angular/common": ~22.1.6
    "@angular/compiler": ~22.1.6
    "@angular/compiler-cli": ~22.1.6
    "@angular/core": ~22.1.6
    "@angular/forms": ~22.1.6
    "@angular/platform-browser": ~22.1.6
    "@angular/router": ~22.1.6
    rxjs: ~7.8.2
    tslib: ~2.8.1
    typescript: ~6.0.3
  markdownlint:
    markdownlint-cli2: ~0.23.2
  prettier:
    prettier: ~3.9.6
    prettier-plugin-organize-imports: ~4.3.0
