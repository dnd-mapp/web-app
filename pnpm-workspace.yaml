minimumReleaseAge: 4320 # 3 days
minimumReleaseAgeExclude:
  - "@dnd-mapp/*"
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 4320 # 3 days

# Peer Dependency Settings
autoInstallPeers: false
dedupePeers: true
peerDependencyRules:
  ignoreMissing: []
strictPeerDependencies: true

# CLI Settings
engineStrict: true

# Build Settings
allowBuilds:
  "@parcel/watcher": false
  esbuild: false
  lefthook: true
  lmdb: false
  msgpackr-extract: false

# Other Settings
catalogMode: strict
savePrefix: "~"

# Catalogs
catalogs:
  angular:
    "@angular/build": ~22.1.8
    "@angular/cdk": ~22.1.6
    "@angular/cli": ~22.1.8
    "@angular/common": ~22.1.6
    "@angular/compiler": ~22.1.6
    "@angular/compiler-cli": ~22.1.6
    "@angular/core": ~22.1.6
    "@angular/forms": ~22.1.6
    "@angular/platform-browser": ~22.1.6
    "@angular/router": ~22.1.6
    rxjs: ~7.8.2
    tslib: ~2.8.1
    typescript: ~6.0.3
  commitlint:
    "@commitlint/cli": ~21.2.2
    "@commitlint/config-conventional": ~21.2.2
  eslint:
    "@eslint/js": ~10.0.1
    angular-eslint: ~22.5.0
    eslint: ~10.10.0
    globals: ~17.12.0
    typescript-eslint: ~8.70.0
  lefthook:
    lefthook: ~2.1.14
  markdownlint:
    markdownlint-cli2: ~0.23.2
  ngx-translate:
    "@ngx-translate/core": ~18.0.0
  playwright:
    "@playwright/test": ~1.63.0
    playwright: ~1.63.0
  prettier:
    prettier: ~3.9.6
    prettier-plugin-organize-imports: ~4.3.0
  stylelint:
    postcss: ~8.5.28
    stylelint: ~17.15.0
    stylelint-config-clean-order: ~10.0.0
    stylelint-config-standard-scss: ~17.0.0
    stylelint-order: ~8.1.1
  vitest:
    "@vitest/browser-playwright": ~4.1.11
    "@vitest/coverage-v8": ~4.1.11
    "@vitest/ui": ~4.1.11
    vitest: ~4.1.11
catalog:
  "@types/node": ~24.13.4
